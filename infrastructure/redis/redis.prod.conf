# BullMQ-safe Redis persistence and memory policy for production.
bind 0.0.0.0
protected-mode yes
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300

# Persistence
appendonly yes
appendfsync everysec
save 900 1
save 300 10
save 60 10000

# Memory — set maxmemory via compose command override if needed.
# CRITICAL: never use allkeys-lru with BullMQ; jobs must not be evicted.
maxmemory-policy noeviction

# Security — requirepass is injected via command line from REDIS_PASSWORD
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command DEBUG ""
